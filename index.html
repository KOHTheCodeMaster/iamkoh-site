  <style>

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #141416; --fg: #f2f2f4; --muted: #9a9aa0; }

    :root[data-theme="dark"] { --bg: #141416; --fg: #f2f2f4; --muted: #9a9aa0; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 0 16px;
      box-sizing: border-box;
      text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 12px; font-weight: 700; letter-spacing: -0.02em; }
